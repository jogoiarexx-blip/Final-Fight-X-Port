name: Sync Final Fight X Web Runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-web-runtime.yml"

permissions:
  contents: write
  actions: read

jobs:
  sync-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published web repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download latest telemetry-enabled WASM runtime
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPO: jogoiarexx-blip/Ports-para-pc
          SOURCE_RUN: "37669600642"
          SOURCE_ARTIFACT: "Final-Fight-X-Web-v0.1-WASM-runtime"
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/runtime"
          gh run download "$SOURCE_RUN" -R "$SOURCE_REPO" -n "$SOURCE_ARTIFACT" -D "$RUNNER_TEMP/runtime"
          find "$RUNNER_TEMP/runtime" -maxdepth 3 -type f -print
          test -s "$RUNNER_TEMP/runtime/ffx.js"
          test -s "$RUNNER_TEMP/runtime/ffx.wasm"
          cp "$RUNNER_TEMP/runtime/ffx.js" ffx.js
          cp "$RUNNER_TEMP/runtime/ffx.wasm" ffx.wasm

      - name: Validate runtime
        run: |
          node --check app.js
          test -s ffx.js
          test -s ffx.wasm
          strings ffx.wasm | grep -q "webDebug" || true
          ls -lh ffx.js ffx.wasm

      - name: Commit runtime to main
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ffx.js ffx.wasm
          if git diff --cached --quiet; then
            echo "Runtime already current."
            exit 0
          fi
          git commit -m "Update WebAssembly runtime with gameplay telemetry"
          git push origin main
